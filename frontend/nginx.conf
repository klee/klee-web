# --- Rate limiting (per client IP; not DDoS protection, which is a CDN/WAF concern) ---
# submit_key is the client IP for POST only, empty otherwise, so the submit zone
# throttles job submissions and leaves polling GETs alone.
map $request_method $submit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $submit_key         zone=submit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api:10m    rate=20r/s;

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS: terminate TLS, serve the app, reverse-proxy the API ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    root /usr/share/nginx/html;

    # Reverse proxy: /api/* -> the api service. The trailing slash on proxy_pass
    # strips the /api prefix, so the backend sees /jobs, not /api/jobs.
    location /api/ {
        limit_req zone=api    burst=40 nodelay;
        limit_req zone=submit burst=5  nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets plus SPA fallback: unknown paths return index.html so
    # client-side routing survives refresh and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
