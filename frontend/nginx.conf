server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Reverse proxy: /api/* -> the api service. The trailing slash on proxy_pass
    # strips the /api prefix, so the backend sees /jobs, not /api/jobs.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets plus SPA fallback: unknown paths return index.html so
    # client-side routing survives refresh and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
