# Compose loads this override automatically for local builds. VM deployment names files explicitly.
services:
  api:
    build:
      context: ./backend
      args:
        KLEE_VERSION: ${KLEE_VERSION:?KLEE_VERSION is required}

  worker:
    build:
      context: ./backend
      args:
        KLEE_VERSION: ${KLEE_VERSION:?KLEE_VERSION is required}

  nginx:
    build:
      context: ./frontend
      args:
        KLEE_VERSION: ${KLEE_VERSION:?KLEE_VERSION is required}
