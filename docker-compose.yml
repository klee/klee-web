services:
  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    image: klee-web-backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      WORKER_CONCURRENCY_MAX: ${WORKER_CONCURRENCY_MAX:-4}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build: ./backend
    image: klee-web-backend
    command:
      - "celery"
      - "-A"
      - "klee_web.celery_app"
      - "worker"
      - "-Q"
      - "klee-jobs"
      - "--autoscale=${WORKER_CONCURRENCY_MAX:-4},1"
      - "--loglevel=info"
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      KLEE_RUNTIME: ${KLEE_RUNTIME:-}
      RUNNER_CPUS: ${RUNNER_CPUS:-2}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-3072}
      RUNNER_SWAP_MB: ${RUNNER_SWAP_MB:-0}
      RUNNER_PIDS_LIMIT: ${RUNNER_PIDS_LIMIT:-128}
      RUNNER_STORAGE_MB: ${RUNNER_STORAGE_MB:-768}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
