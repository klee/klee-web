services:
  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  api:
    image: ${BACKEND_IMAGE:-klee-web-backend}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      WORKER_CONCURRENCY_MAX: ${WORKER_CONCURRENCY_MAX:-4}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    image: ${BACKEND_IMAGE:-klee-web-backend}
    # Replicas count containers. Celery autoscale below controls slots inside each container.
    scale: ${WORKER_REPLICAS:-1}
    restart: unless-stopped
    # Allow Celery's 660-second hard task ceiling plus cleanup before SIGKILL.
    stop_grace_period: 675s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "celery"
      - "-A"
      - "klee_web.celery_app"
      - "worker"
      - "-Q"
      - "klee-jobs"
      - "--autoscale=${WORKER_CONCURRENCY_MAX:-4},1"
      - "--loglevel=info"
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      KLEE_RUNTIME: ${KLEE_RUNTIME:-}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-klee-web-runner}
      RUNNER_CPUS: ${RUNNER_CPUS:-2}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-3072}
      RUNNER_SWAP_MB: ${RUNNER_SWAP_MB:-0}
      RUNNER_PIDS_LIMIT: ${RUNNER_PIDS_LIMIT:-128}
      RUNNER_STORAGE_MB: ${RUNNER_STORAGE_MB:-768}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: ${FRONTEND_IMAGE:-klee-web-frontend}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - admin_htpasswd
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:

secrets:
  admin_htpasswd:
    file: ${ADMIN_HTPASSWD_FILE:-./.secrets/admin.htpasswd}
