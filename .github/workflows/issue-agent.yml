name: Issue Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        required: true
        description: Issue number to work on
      dry_run:
        type: boolean
        required: false
        default: false
        description: Build the prompt and comment without running the agent

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:ready' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      - name: Install issue agent CLI
        if: ${{ vars.ISSUE_AGENT_INSTALL_COMMAND != '' }}
        run: ${{ vars.ISSUE_AGENT_INSTALL_COMMAND }}

      - name: Run issue agent
        run: python bot/issue_agent.py --issue "${{ github.event.issue.number || inputs.issue }}" --dry-run "${{ inputs.dry_run || 'false' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: true
          ISSUE_AGENT_COMMAND: ${{ vars.ISSUE_AGENT_COMMAND }}
          ISSUE_AGENT_CHECKS: |
            cd backend && uv run pytest tests/unit
            cd frontend && npm run build
