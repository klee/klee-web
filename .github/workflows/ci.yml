name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/unit
      - run: uv run pytest tests/integration -m "not requires_docker"
      - run: uv run mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: mypy

  integration-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
        working-directory: backend
      - name: Install gVisor (runsc) and register the runtime
        run: |
          set -euo pipefail
          GVISOR_RELEASE=20260706   # keep in sync with the runsc version installed on the deploy host
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512" \
               "${URL}/containerd-shim-runsc-v1" "${URL}/containerd-shim-runsc-v1.sha512"
          sha512sum -c runsc.sha512 -c containerd-shim-runsc-v1.sha512
          chmod a+rx runsc containerd-shim-runsc-v1
          sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin
          sudo runsc install
          sudo systemctl restart docker
      - name: Build runner image
        run: docker build -t klee-web-runner ./runner
      - name: Run docker integration tests
        run: uv run pytest tests/integration -m requires_docker -v
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gVisor (runsc) and register the runtime
        run: |
          set -euo pipefail
          GVISOR_RELEASE=20260706   # keep in sync with the deploy host and integration-docker
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/${ARCH}"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512" \
               "${URL}/containerd-shim-runsc-v1" "${URL}/containerd-shim-runsc-v1.sha512"
          sha512sum -c runsc.sha512 -c containerd-shim-runsc-v1.sha512
          chmod a+rx runsc containerd-shim-runsc-v1
          sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin
          sudo runsc install
          sudo systemctl restart docker
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          KLEE_RUNTIME: runsc
      - name: Verify e2e containers were removed
        if: always()
        run: test -z "$(docker ps --filter label=com.docker.compose.project=klee-web-e2e --quiet)"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  edge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the test admin credential
        run: |
          mkdir -p .secrets
          chmod 700 .secrets
          docker run --rm httpd:2.4.68-alpine \
            htpasswd -nbB admin test-password > .secrets/admin.htpasswd
          chmod 644 .secrets/admin.htpasswd
      - name: Services have restart and log retention policies
        run: |
          config=$(docker compose config --format json)
          for service in redis api worker nginx; do
            jq -e --arg service "$service" '
              .services[$service].restart == "unless-stopped" and
              .services[$service].logging.driver == "json-file" and
              .services[$service].logging.options["max-size"] == "10m" and
              .services[$service].logging.options["max-file"] == "3"
            ' <<< "$config"
          done
      - name: Services accept registry image references
        env:
          BACKEND_IMAGE: registry.example/klee-web-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE: registry.example/klee-web-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          RUNNER_IMAGE: registry.example/klee-web-runner@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          config=$(docker compose config --format json)
          jq -e \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg runner "$RUNNER_IMAGE" '
              .services.api.image == $backend and
              .services.worker.image == $backend and
              .services.nginx.image == $frontend and
              .services.worker.environment.RUNNER_IMAGE == $runner
            ' <<< "$config"
      - name: Bring up the edge (nginx pulls in api and redis via depends_on)
        run: docker compose up -d --build --wait nginx
      - name: HTTP redirects to HTTPS
        run: curl -fsSI http://localhost/ | grep -q https://localhost
      - name: The built app is served over HTTPS
        run: curl -fsSk https://localhost/ | grep -q /assets/
      - name: The API is reachable and prefix-stripped under /api
        run: curl -fsSk https://localhost/api/openapi.json | grep -q openapi
      - name: Admin routes require authentication
        run: |
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/admin)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/admin/stats)" = 401
      - name: Admin routes accept the test credential
        run: |
          curl -fsSku admin:test-password https://localhost/admin | grep -q /assets/
          curl -fsSku admin:test-password https://localhost/api/admin/stats > /dev/null
      - name: Internal service ports bind only to loopback
        run: |
          test "$(docker compose port api 8000)" = "127.0.0.1:8000"
          test "$(docker compose port redis 6379)" = "127.0.0.1:6379"
      - name: A terminated Worker restarts automatically
        run: |
          docker compose up -d worker
          container_id=$(docker compose ps -q worker)
          sleep 11
          docker exec "$container_id" python -c 'import os, signal; os.kill(1, signal.SIGTERM)'
          for _ in $(seq 1 20); do
            restart_count=$(docker inspect --format '{{.RestartCount}}' "$container_id")
            running=$(docker inspect --format '{{.State.Running}}' "$container_id")
            if [ "$restart_count" -ge 1 ] && [ "$running" = true ]; then
              if curl -fsSku admin:test-password https://localhost/api/admin/telemetry \
                | jq -e '.workers | length > 0' > /dev/null; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker inspect "$container_id"
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down
