services:
  nginx:
    # Directory mounts follow certificate-generation symlink changes.
    volumes: !override
      - type: bind
        source: ${TLS_CERTIFICATE_DIRECTORY:?TLS_CERTIFICATE_DIRECTORY must be set}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ${ACME_WEBROOT_DIRECTORY:?ACME_WEBROOT_DIRECTORY must be set}
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
