repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(backend/tests/fixtures/.*/output/|docs/thesis-evidence/patches/.*\.patch$)
      - id: end-of-file-fixer
        exclude: ^backend/tests/fixtures/.*/output/
      - id: check-yaml
        exclude: ^deploy/compose\.worker\.yml$
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npm run format'
        language: system
        files: ^frontend/.*\.(ts|tsx|css)$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: e2e-playwright
        name: Playwright e2e (real KLEE, local only)
        entry: bash -c 'cd frontend && npm run test:e2e'
        language: system
        files: ^(frontend|backend|runner)/
        pass_filenames: false
        stages: [pre-push]
        require_serial: true
